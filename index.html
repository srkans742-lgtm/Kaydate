<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="KayDate — keşfet, kaydet, planla, git.">
<link rel="manifest" href="manifest.webmanifest"><title>KayDate</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f7fb;color:#17171c}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}.top{padding:22px 18px 8px}.brand{font-size:29px;font-weight:850}.brand span{color:#6d5dfc}.sub{color:#777;margin-top:2px}
.search{margin:10px 18px;padding:14px 15px;border:1px solid #e4e5eb;border-radius:16px;background:#fafafe;width:calc(100% - 36px);font-size:16px;outline:none}
main{padding:8px 18px 105px}.hero{background:#111827;color:#fff;border-radius:25px;padding:23px;margin:7px 0 17px}.hero h1{font-size:26px;line-height:1.1;margin:0 0 8px}.hero p{margin:0;color:#d1d5db}
.row{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.chip{border:0;background:#f0efff;color:#5145cd;padding:10px 14px;border-radius:99px;white-space:nowrap}
.section{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}.section h2{font-size:19px;margin:0}.muted{color:#777}.cards{display:grid;gap:12px}
.card{border:1px solid #ececf1;border-radius:19px;padding:15px;background:#fff;box-shadow:0 4px 18px #11111108}.card h3{margin:0 0 5px;font-size:18px}.meta{font-size:13px;color:#777}.note{margin:8px 0;color:#555;font-size:14px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:700}.save{background:#eeeafd;color:#5145cd}.green{background:#eaf8ef;color:#18733b}.light{background:#f0f1f4}.primary{background:#6d5dfc;color:white}
.add{position:fixed;right:20px;bottom:82px;width:58px;height:58px;border:0;border-radius:50%;background:#6d5dfc;color:white;font-size:30px;box-shadow:0 10px 25px #6d5dfc55;z-index:4}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:#777;font-size:11px}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav .active{color:#6d5dfc}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:10;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:560px;margin:auto;border-radius:25px 25px 0 0;padding:21px;max-height:90vh;overflow:auto}.sheet input,.sheet select,.sheet textarea{width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:12px;font-size:16px;font-family:inherit}.sheet textarea{min-height:80px}.sheet .primary{width:100%;padding:14px;border:0;border-radius:13px;font-weight:800;margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f7f7fa;border-radius:15px;padding:15px;text-align:center}.stat b{display:block;font-size:22px}.empty{text-align:center;padding:35px 15px;color:#777}
.mapbox{height:310px;border-radius:20px;overflow:hidden;background:#eef0f4}.mapbox iframe{width:100%;height:100%;border:0}.linkbox{background:#f5f5f8;border-radius:14px;padding:12px;font-size:13px;word-break:break-all}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">Kay<span>Date</span> 📍</div><div class="sub">Keşfet. Kaydet. Planla. Git.</div></header>
<input id="search" class="search" placeholder="Yer, şehir veya kategori ara…">
<main id="content"></main><button class="add" onclick="openAdd()">+</button>
<nav class="nav"><button class="active" onclick="show('home',this)"><b>⌂</b>Ana Sayfa</button><button onclick="show('map',this)"><b>🗺</b>Harita</button><button onclick="openAdd()"><b>＋</b>Kaydet</button><button onclick="show('saved',this)"><b>♥</b>Listelerim</button><button onclick="show('profile',this)"><b>●</b>Profil</button></nav>
</div>

<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeAdd()"><div class="sheet">
<h2>📍 Yer kaydet</h2><input id="name" placeholder="Yer adı"><input id="city" placeholder="Şehir">
<select id="cat"><option>Restoran</option><option>Kafe</option><option>Gezi</option><option>Doğa</option><option>Otel</option><option>Plaj</option><option>Alışveriş</option><option>Diğer</option></select>
<textarea id="note" placeholder="Kısa not (isteğe bağlı)"></textarea><input id="url" placeholder="Instagram / TikTok / Google Maps linki (isteğe bağlı)">
<button class="primary" onclick="addPlace()">Kaydet ❤️</button></div></div>

<script>
const defaults=[
{name:"Zeugma Mozaik Müzesi",city:"Gaziantep",cat:"Gezi",done:false,note:"",url:""},
{name:"Karaköy",city:"İstanbul",cat:"Gezi",done:false,note:"",url:""},
{name:"Balıklıgöl",city:"Şanlıurfa",cat:"Gezi",done:false,note:"",url:""}
];
let places=JSON.parse(localStorage.getItem("kaydate-v2")||"null")||defaults;
let filter="Tümü"; const save=()=>localStorage.setItem("kaydate-v2",JSON.stringify(places));
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function maps(p){location.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+" "+p.city)}
function share(p){if(navigator.share)navigator.share({title:p.name,text:"KayDate'de kaydettiğim yer: "+p.name+" — "+p.city,url:p.url||location.href});else navigator.clipboard?.writeText(p.url||location.href).then(()=>alert("Bağlantı kopyalandı."))}
function card(p,i){return '<article class="card"><h3>'+esc(p.name)+'</h3><div class="meta">📍 '+esc(p.city)+' · '+esc(p.cat)+(p.done?' · 🟢 Gidildi':'')+'</div>'+(p.note?'<div class="note">'+esc(p.note)+'</div>':'')+'<div class="actions"><button class="btn save" onclick="toggle('+i+')">'+(p.done?'↩️ Tekrar planla':'❤️ Gitmek istiyorum')+'</button><button class="btn light" onclick="maps(places['+i+'])">🧭 Rota</button><button class="btn light" onclick="share(places['+i+'])">↗️ Paylaş</button></div></article>'}
function filtered(q=""){return places.filter(p=>(filter==="Tümü"||p.cat===filter)&&(p.name+" "+p.city+" "+p.cat+" "+p.note).toLowerCase().includes(q.toLowerCase()))}
function render(q=""){let a=filtered(q);document.getElementById("content").innerHTML='<section class="hero"><h1>Bugün nereye gitmek istersin?</h1><p>Beğendiğin yerleri kaydet, sonra kolayca bul.</p></section><div class="row">'+["Tümü","Restoran","Kafe","Gezi","Doğa","Otel","Plaj"].map(x=>'<button class="chip" onclick="filterCat(\''+x+'\')">'+x+'</button>').join("")+'</div><div class="section"><h2>✨ Keşfet</h2><button class="btn primary" onclick="planner()">✨ Bana gezi planla</button></div><div class="cards">'+(a.map(card).join("")||'<div class="empty">Sonuç bulunamadı.</div>')+'</div>'}
function filterCat(c){filter=c;render(document.getElementById("search").value)}
function toggle(i){places[i].done=!places[i].done;save();render(document.getElementById("search").value)}
function show(t,el){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(el)el.classList.add("active");
if(t==="home"){filter="Tümü";render()}
if(t==="saved"){let a=places.filter(p=>!p.done);document.getElementById("content").innerHTML='<div class="section"><h2>❤️ Gitmek İstediklerim</h2></div><div class="cards">'+(a.map(card).join("")||'<div class="empty">Henüz yer kaydetmedin.</div>')+'</div><div class="section"><h2>🟢 Gittiklerim</h2></div><div class="cards">'+places.filter(p=>p.done).map(card).join("")+'</div>'}
if(t==="map"){let q=places.map(p=>p.name+" "+p.city).join("|");document.getElementById("content").innerHTML='<section class="hero"><h1>🗺️ Haritam</h1><p>Kaydettiğin yerleri Google Maps üzerinde aç.</p></section><div class="cards">'+places.map((p,i)=>'<article class="card"><h3>'+esc(p.name)+'</h3><div class="meta">📍 '+esc(p.city)+'</div><div class="actions"><button class="btn primary" onclick="maps(places['+i+'])">🧭 Haritada aç</button></div></article>').join("")+'</div>'}
if(t==="profile"){let done=places.filter(p=>p.done).length;document.getElementById("content").innerHTML='<section class="hero"><h1>👤 Profil</h1><p>KayDate maceran</p></section><div class="stats"><div class="stat"><b>'+places.length+'</b>Kaydedilen</div><div class="stat"><b>'+done+'</b>Gidilen</div><div class="stat"><b>'+Math.max(0,places.length-done)+'</b>Plan</div></div><div class="section"><h2>🔗 Linkten kaydet</h2></div><div class="card"><p class="muted">Instagram, TikTok veya Google Maps linkini aşağıya yapıştır; KayDate linki kaydeder ve daha sonra açmana izin verir.</p><input id="importLink" class="search" style="margin:8px 0;width:100%" placeholder="https://…"><button class="btn primary" onclick="importLink()">Bağlantıyı kaydet</button></div>}}
function planner(){let want=places.filter(p=>!p.done);let picks=want.slice(0,4);let text=picks.length?picks.map((p,i)=>(i+1)+". "+p.name+" — "+p.city+" ("+p.cat+")").join("\n"):"Önce birkaç yer kaydet.";document.getElementById("content").innerHTML='<section class="hero"><h1>✨ Gezi planın</h1><p>Kaydettiğin yerlere göre hızlı bir plan.</p></section><div class="card"><div style="white-space:pre-line;line-height:1.7">'+esc(text)+'</div><div class="actions"><button class="btn primary" onclick="share({name:'KayDate gezi planım',city:'',url:location.href})">↗️ Planı paylaş</button></div></div><div class="section"><h2>💡 İpucu</h2></div><div class="card">Gerçek yapay zekâ planlayıcısı için ileride bir AI API anahtarı bağlayacağız; bu MVP sürümünde planlama tamamen cihaz üzerinde çalışıyor.</div>'}
function importLink(){let u=document.getElementById("importLink").value.trim();if(!u)return alert("Bir bağlantı gir.");places.unshift({name:"Paylaşılan yer",city:"",cat:"Diğer",done:false,note:"Bağlantıdan kaydedildi",url:u});save();alert("Bağlantı KayDate'e kaydedildi.");show("saved",document.querySelectorAll(".nav button")[3])}
function openAdd(){document.getElementById("modal").style.display="flex"}function closeAdd(){document.getElementById("modal").style.display="none"}
function addPlace(){let n=document.getElementById("name").value.trim(),c=document.getElementById("city").value.trim(),cat=document.getElementById("cat").value,note=document.getElementById("note").value.trim(),url=document.getElementById("url").value.trim();if(!n)return alert("Yer adı gerekli.");places.unshift({name:n,city:c,cat,done:false,note,url});save();closeAdd();document.getElementById("name").value="";document.getElementById("city").value="";render()}
document.getElementById("search").addEventListener("input",e=>render(e.target.value));
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script></body></html>
