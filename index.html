<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="KayDate — keşfet, kaydet, planla, git.">
<link rel="manifest" href="manifest.webmanifest"><title>KayDate</title>
<style>
:root{--p:#6758f5;--ink:#15151a;--muted:#777782;--bg:#f7f7fb;--line:#ececf2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}.top{padding:20px 20px 8px}.brand{font-size:28px;font-weight:850}.brand span{color:var(--p)}.sub{color:var(--muted);font-size:14px}.search{margin:10px 20px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;width:calc(100% - 40px);background:#fafafd;outline:none}.search:focus{border-color:#bbb4ff}
main{padding:8px 20px 105px}.hero{background:#111827;color:white;border-radius:25px;padding:23px;margin:8px 0 18px}.hero h1{font-size:27px;line-height:1.12;margin:0 0 9px}.hero p{margin:0;color:#d5d7df}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}.chip{border:0;background:#f0efff;color:#5145cd;padding:10px 14px;border-radius:99px;white-space:nowrap}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 11px}.section h2{font-size:19px;margin:0}.link{border:0;background:none;color:var(--p);font-weight:700}.cards{display:grid;gap:12px}.card{border:1px solid var(--line);border-radius:19px;padding:15px;background:#fff;box-shadow:0 5px 20px #1111}.card h3{margin:0 0 5px;font-size:18px}.meta{font-size:13px;color:var(--muted)}.note{font-size:13px;margin:8px 0;color:#4c4c55}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:700}.save{background:#eeecff;color:#5145cd}.done{background:#e9f8ee;color:#18733b}.neutral{background:#f2f2f5}.danger{background:#fff0f0;color:#b3261e}.add{position:fixed;right:22px;bottom:83px;width:59px;height:59px;border:0;border-radius:50%;background:var(--p);color:white;font-size:30px;box-shadow:0 10px 28px #6758f555;z-index:4}.nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:#777;font-size:11px}.nav b{display:block;font-size:20px;line-height:22px}.nav .active{color:var(--p)}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:560px;margin:auto;border-radius:25px 25px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet input,.sheet select,.sheet textarea{width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:12px;outline:none}.primary{width:100%;padding:14px;border:0;border-radius:13px;background:var(--p);color:#fff;font-weight:800;margin-top:8px}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}.result{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.result small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:16px 10px;border:1px solid var(--line);border-radius:16px;text-align:center}.stat strong{display:block;font-size:22px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.photo{width:100%;height:160px;object-fit:cover;border-radius:15px;margin-bottom:10px}.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--p)}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">Kay<span>Date</span> 📍</div><div class="sub">Keşfet · Kaydet · Planla · Git</div></header>
<input id="search" class="search" placeholder="Yer, şehir veya kategori ara…">
<main id="content"></main>
<button class="add" onclick="openAdd()">+</button>
<nav class="nav">
<button class="active" onclick="show('home',this)"><b>⌂</b>Ana Sayfa</button>
<button onclick="show('map',this)"><b>🗺</b>Harita</button>
<button onclick="show('saved',this)"><b>♥</b>Listelerim</button>
<button onclick="show('profile',this)"><b>●</b>Profil</button>
</nav></div>

<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">Yeni yer kaydet</h2><div id="modalBody"></div></div></div>

<script>
const KEY='kaydate_v2';
const defaults=[
{name:'Zeugma Mozaik Müzesi',city:'Gaziantep',cat:'Gezi',status:'want',note:'',photo:''},
{name:'Karaköy',city:'İstanbul',cat:'Gezi',status:'want',note:'',photo:''},
{name:'Balıklıgöl',city:'Şanlıurfa',cat:'Gezi',status:'want',note:'',photo:''},
{name:'Tarihi Bakırcılar Çarşısı',city:'Gaziantep',cat:'Alışveriş',status:'done',note:'',photo:''}
];
let places=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;let searchTimer;
const save=()=>localStorage.setItem(KEY,JSON.stringify(places));
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function card(p,i){return '<article class="card">'+(p.photo?'<img class="photo" src="'+p.photo+'">':'')+'<h3>'+esc(p.name)+'</h3><div class="meta">📍 '+esc(p.city)+' · '+esc(p.cat)+(p.lat?' · '+distance(p.lat,p.lon):'')+'</div>'+(p.note?'<div class="note">📝 '+esc(p.note)+'</div>':'')+'<div class="actions"><button class="btn '+(p.status==='done'?'done':'save')+'" onclick="toggle('+i+')">'+(p.status==='done'?'🟢 Gidildi':'❤️ Gitmek istiyorum')+'</button><button class="btn neutral" onclick="maps('+i+')">🧭 Rota</button><button class="btn neutral" onclick="sharePlace('+i+')">↗️ Paylaş</button><button class="btn neutral" onclick="editPlace('+i+')">✏️ Düzenle</button></div></article>'}
function render(q=''){let a=places.filter(p=>(p.name+' '+p.city+' '+p.cat).toLowerCase().includes(q.toLowerCase()));document.getElementById('content').innerHTML='<section class="hero"><h1>Bugün nereye gitmek istersin?</h1><p>Beğendiğin yerleri kaydet, sonra kolayca bul.</p></section><div class="chips">'+['Tümü','Restoran','Kafe','Gezi','Doğa','Otel','Plaj','Alışveriş'].map(x=>'<button class="chip" onclick="filterCat(\''+x+'\')">'+x+'</button>').join('')+'</div><div class="section"><h2>✨ Keşfet</h2><button class="link" onclick="openPlanner()">🤖 Gezi planla</button></div><div class="cards">'+(a.map(card).join('')||'<div class="empty">Sonuç bulunamadı.</div>')+'</div>'}
function filterCat(c){if(c==='Tümü')return render();let a=places.filter(p=>p.cat===c);document.getElementById('content').innerHTML='<div class="section"><h2>'+c+'</h2></div><div class="cards">'+(a.map((p)=>card(p,places.indexOf(p))).join('')||'<div class="empty">Bu kategoride kayıt yok.</div>')+'</div>'}
function toggle(i){places[i].status=places[i].status==='done'?'want':'done';save();render(document.getElementById('search').value)}
function show(t,el){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));el&&el.classList.add('active');
if(t==='home')render();
if(t==='map'){document.getElementById('content').innerHTML='<section class="hero"><h1>🗺 Haritam</h1><p>Kaydettiğin yerleri tek dokunuşla haritada aç.</p><button class="btn save" onclick="nearby()">📍 Konumumu kullan</button></section><div class="cards">'+places.map((p,i)=>card(p,i)).join('')+'</div>'}
if(t==='saved'){let want=places.filter(p=>p.status==='want'),done=places.filter(p=>p.status==='done');document.getElementById('content').innerHTML='<div class="section"><h2>❤️ Gitmek İstediklerim</h2></div><div class="cards">'+(want.map(p=>card(p,places.indexOf(p))).join('')||'<div class="empty">Henüz yer kaydetmedin.</div>')+'</div><div class="section"><h2>🟢 Gittiklerim</h2></div><div class="cards">'+(done.map(p=>card(p,places.indexOf(p))).join('')||'<div class="empty">Henüz ziyaret yok.</div>')+'</div>'}
if(t==='profile'){let done=places.filter(p=>p.status==='done').length;document.getElementById('content').innerHTML='<section class="hero"><h1>👤 Profil</h1><p>KayDate maceran</p></section><div class="stats"><div class="stat"><strong>'+places.length+'</strong>Kaydedilen</div><div class="stat"><strong>'+done+'</strong>Gidilen</div><div class="stat"><strong>'+Math.max(0,places.length-done)+'</strong>Planlanan</div></div><div class="section"><h2>⚙️ Araçlar</h2></div><div class="cards"><article class="card"><h3>📤 Verilerini dışa aktar</h3><div class="actions"><button class="btn save" onclick="exportData()">JSON indir</button><button class="btn neutral" onclick="shareAll()">Listeyi paylaş</button></div></article><article class="card"><h3>📥 İçeri aktar</h3><input type="file" accept=".json" onchange="importData(event)"></article><article class="card"><h3>📱 Uygulamayı yükle</h3><p class="meta">Tarayıcı menüsünden “Ana ekrana ekle” seçeneğini kullan.</p></article></div>'}}
function openAdd(){openForm(-1)}function editPlace(i){openForm(i)}
function openForm(i){const p=i>=0?places[i]:{name:'',city:'',cat:'Restoran',note:'',photo:''};document.getElementById('modalTitle').textContent=i>=0?'Yeri düzenle':'Yeni yer kaydet';document.getElementById('modalBody').innerHTML='<input id="fName" placeholder="Yer adı" value="'+esc(p.name)+'"><input id="fCity" placeholder="Şehir" value="'+esc(p.city)+'"><select id="fCat">'+['Restoran','Kafe','Gezi','Doğa','Otel','Plaj','Alışveriş','Diğer'].map(x=>'<option '+(x===p.cat?'selected':'')+'>'+x+'</option>').join('')+'</select><textarea id="fNote" rows="3" placeholder="Notun (isteğe bağlı)">'+esc(p.note)+'</textarea><input id="fPhoto" type="file" accept="image/*"><button class="primary" onclick="saveForm('+i+')">'+(i>=0?'Kaydet':'Kaydet ❤️')+'</button>'+(i>=0?'<button class="btn danger" style="width:100%;margin-top:8px" onclick="deletePlace('+i+')">Sil</button>':'');document.getElementById('modal').style.display='flex'}
function saveForm(i){let n=document.getElementById('fName').value.trim(),c=document.getElementById('fCity').value.trim(),cat=document.getElementById('fCat').value,note=document.getElementById('fNote').value.trim(),file=document.getElementById('fPhoto').files[0];if(!n||!c)return alert('Yer adı ve şehir gerekli.');const finish=photo=>{if(i<0)places.unshift({name:n,city:c,cat,status:'want',note,photo:photo||''});else Object.assign(places[i],{name:n,city:c,cat,note,photo:photo!==undefined?photo:places[i].photo});save();closeModal();render()};if(file){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish(undefined)}
function deletePlace(i){if(confirm('Bu yeri silmek istiyor musun?')){places.splice(i,1);save();closeModal();render()}}
function closeModal(){document.getElementById('modal').style.display='none'}
function maps(i){let p=places[i];location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+' '+p.city)}
async function sharePlace(i){let p=places[i],txt='📍 '+p.name+' — '+p.city+'\nKayDate';if(navigator.share){try{await navigator.share({title:p.name,text:txt,url:location.href})}catch(e){}}else navigator.clipboard?.writeText(txt).then(()=>alert('Kopyalandı.'))}
async function shareAll(){let txt='KayDate listem:\n'+places.map(p=>'📍 '+p.name+' — '+p.city).join('\n');if(navigator.share){try{await navigator.share({title:'KayDate listem',text:txt})}catch(e){}}else{await navigator.clipboard.writeText(txt);alert('Liste kopyalandı.')}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(places,null,2)],{type:'application/json'}));a.download='kaydate-yedek.json';a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{places=JSON.parse(r.result);save();render();alert('Veriler aktarıldı.')}catch{alert('Geçersiz yedek dosyası.')}};r.readAsText(f)}
function distance(){return ''} 
function nearby(){if(!navigator.geolocation)return alert('Konum desteklenmiyor.');navigator.geolocation.getCurrentPosition(pos=>{let {latitude,longitude}=pos.coords;location.href='https://www.google.com/maps/search/?api=1&query='+latitude+','+longitude},()=>alert('Konum izni verilmedi.'))}
async function openPlanner(){document.getElementById('modalTitle').textContent='🤖 Sana gezi planlayalım';document.getElementById('modalBody').innerHTML='<select id="days"><option value="1">1 günlük</option><option value="2">2 günlük</option><option value="3">3 günlük</option></select><input id="budget" type="number" placeholder="Bütçe (TL)"><input id="cityP" placeholder="Şehir (ör. Gaziantep)"><select id="style"><option>Karışık</option><option>Yemek ağırlıklı</option><option>Kültür</option><option>Doğa</option><option>Çift</option></select><button class="primary" onclick="makePlan()">Planı oluştur ✨</button>';document.getElementById('modal').style.display='flex'}
function makePlan(){let city=document.getElementById('cityP').value.trim().toLowerCase(),days=+document.getElementById('days').value,style=document.getElementById('style').value;let a=places.filter(p=>!city||p.city.toLowerCase().includes(city));if(style==='Yemek ağırlıklı')a.sort((x,y)=>(y.cat==='Restoran')-(x.cat==='Restoran'));if(style==='Kültür')a.sort((x,y)=>(y.cat==='Gezi')-(x.cat==='Gezi'));if(style==='Doğa')a.sort((x,y)=>(y.cat==='Doğa')-(x.cat==='Doğa'));a=a.slice(0,days*4);let plan='';for(let d=0;d<days;d++){let day=a.slice(d*4,d*4+4);plan+='<h3>Gün '+(d+1)+'</h3>'+(day.length?day.map((p,j)=>'<div class="result"><b>'+['☀️ Sabah','🍽️ Öğle','🌇 Akşamüstü','🌙 Akşam'][j]+'</b><br>📍 '+esc(p.name)+'<small> · '+esc(p.city)+'</small></div>').join(''):'<p class="meta">Bu şehirde yeterli kayıt yok. Yeni yerler ekle.</p>')}document.getElementById('modalTitle').textContent='✨ Gezi planın';document.getElementById('modalBody').innerHTML=plan+'<button class="primary" onclick="closeModal()">Tamam</button>'}
async function venueSearch(q){if(!q)return;try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=tr&q='+encodeURIComponent(q));let data=await r.json();document.getElementById('content').innerHTML='<div class="section"><h2>🔎 Mekan sonuçları</h2></div><div class="cards">'+data.map(x=>'<div class="result" onclick="saveSearchResult('+JSON.stringify(x.display_name).replace(/</g,'\\u003c')+','+x.lat+','+x.lon+')"><b>'+esc(x.display_name.split(',')[0])+'</b><br><small>'+esc(x.display_name)+'</small></div>').join('')+'</div>'+(data.length?'':'<div class="empty">Sonuç bulunamadı.</div>')}catch{render(q)}}
function saveSearchResult(name,lat,lon){let parts=name.split(',');places.unshift({name:parts[0],city:parts[parts.length-2]||parts[1]||'',cat:'Diğer',status:'want',note:'',photo:'',lat:+lat,lon:+lon});save();render()}
document.getElementById('search').addEventListener('input',e=>{clearTimeout(searchTimer);let q=e.target.value.trim();searchTimer=setTimeout(()=>q?venueSearch(q):render(),450)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
