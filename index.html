<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>KayDate</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f7fb;color:#17171c}.app{max-width:520px;margin:auto;min-height:100vh;background:white}.top{padding:24px 20px 10px}.brand{font-size:28px;font-weight:800}.brand span{color:#6d5dfc}.sub{color:#777}.search{margin:12px 20px;padding:14px;border:1px solid #e6e6ed;border-radius:16px;width:calc(100% - 40px);font-size:16px}main{padding:8px 20px 100px}.hero{background:#111827;color:white;border-radius:24px;padding:22px;margin:8px 0 20px}.hero h1{margin:0 0 8px}.hero p{color:#d1d5db}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.chip{border:0;background:#f0efff;color:#5145cd;padding:10px 14px;border-radius:99px;white-space:nowrap}.section{margin:18px 0 10px}.cards{display:grid;gap:12px}.card{border:1px solid #eee;border-radius:18px;padding:15px}.card h3{margin:0 0 5px}.meta{color:#777;font-size:13px}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:650}.save{background:#eeeafd;color:#5145cd}.add{position:fixed;right:22px;bottom:82px;width:58px;height:58px;border:0;border-radius:50%;background:#6d5dfc;color:white;font-size:30px}.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:white;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 4px}.nav button{border:0;background:none;color:#777;font-size:12px}.nav b{display:block;font-size:20px}.nav .active{color:#6d5dfc}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end}.sheet{background:white;width:100%;max-width:520px;margin:auto;border-radius:25px 25px 0 0;padding:22px}.sheet input,.sheet select{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:12px;font-size:16px}.primary{width:100%;padding:14px;border:0;border-radius:13px;background:#6d5dfc;color:white;font-weight:700}</style></head><body><div class="app"><header class="top"><div class="brand">Kay<span>Date</span> 📍</div><div class="sub">Keşfet. Kaydet. Git.</div></header><input id="search" class="search" placeholder="Yer, şehir veya kategori ara…"><main id="content"></main><button class="add" onclick="openAdd()">+</button><nav class="nav"><button class="active" onclick="show('home',this)"><b>⌂</b>Ana Sayfa</button><button onclick="show('saved',this)"><b>♥</b>Listelerim</button><button onclick="openAdd()"><b>＋</b>Kaydet</button><button onclick="show('profile',this)"><b>●</b>Profil</button></nav></div><div id="modal" class="modal" onclick="if(event.target.id==='modal')closeAdd()"><div class="sheet"><h2>Yeni yer kaydet</h2><input id="name" placeholder="Yer adı"><input id="city" placeholder="Şehir"><select id="cat"><option>Restoran</option><option>Kafe</option><option>Gezi</option><option>Doğa</option><option>Otel</option><option>Plaj</option></select><button class="primary" onclick="addPlace()">Kaydet ❤️</button></div></div><script>const defaults=[{name:"Zeugma Mozaik Müzesi",city:"Gaziantep",cat:"Gezi",done:false},{name:"Karaköy",city:"İstanbul",cat:"Gezi",done:false},{name:"Balıklıgöl",city:"Şanlıurfa",cat:"Gezi",done:false}];let places=JSON.parse(localStorage.getItem("kaydate")||"null")||defaults;const save=()=>localStorage.setItem("kaydate",JSON.stringify(places));function card(p,i){return '<article class="card"><h3>'+p.name+'</h3><div class="meta">📍 '+p.city+' · '+p.cat+'</div><div class="actions"><button class="btn save" onclick="toggle('+i+')">'+(p.done?'🟢 Gidildi':'❤️ Gitmek istiyorum')+'</button><button class="btn" onclick="maps(\''+encodeURIComponent(p.name+' '+p.city)+'\')">🧭 Rota</button></div></article>'}function render(q=''){let a=places.filter(p=>(p.name+' '+p.city+' '+p.cat).toLowerCase().includes(q.toLowerCase()));document.getElementById('content').innerHTML='<section class="hero"><h1>Bugün nereye gitmek istersin?</h1><p>Beğendiğin yerleri kaydet, sonra kolayca bul.</p></section><div class="chips">'+['Tümü','Restoran','Kafe','Gezi','Doğa','Otel'].map(x=>'<button class="chip" onclick="filterCat(\''+x+'\')">'+x+'</button>').join('')+'</div><div class="section"><h2>✨ Keşfet</h2></div><div class="cards">'+a.map(card).join('')+'</div>'}function filterCat(c){if(c==='Tümü')return render();let a=places.filter(p=>p.cat===c);document.getElementById('content').innerHTML='<div class="section"><h2>'+c+'</h2></div><div class="cards">'+a.map(card).join('')+'</div>'}function toggle(i){places[i].done=!places[i].done;save();render(document.getElementById('search').value)}function show(t,el){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));el&&el.classList.add('active');if(t==='home')render();if(t==='saved'){let a=places.filter(p=>!p.done);document.getElementById('content').innerHTML='<div class="section"><h2>❤️ Gitmek İstediklerim</h2></div><div class="cards">'+a.map(card).join('')+'</div>'}if(t==='profile'){document.getElementById('content').innerHTML='<section class="hero"><h1>👤 Profil</h1><p>'+places.length+' yer kaydettin · '+places.filter(p=>p.done).length+' yer gezdin.</p></section>'}}function maps(q){location.href='https://www.google.com/maps/search/?api=1&query='+q}function openAdd(){document.getElementById('modal').style.display='flex'}function closeAdd(){document.getElementById('modal').style.display='none'}function addPlace(){let n=document.getElementById('name').value.trim(),c=document.getElementById('city').value.trim(),cat=document.getElementById('cat').value;if(!n||!c)return alert('Yer adı ve şehir gerekli.');places.unshift({name:n,city:c,cat,done:false});save();closeAdd();render()}document.getElementById('search').addEventListener('input',e=>render(e.target.value));render();</script></body></html>
